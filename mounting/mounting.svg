<text x="40.0" y="70.0" font-size="15" text-anchor="start" fill="#566a75">Jaycar HB6128 (171 × 121 × 55) for the board and valve coil (valve body outside), HB6127 (115 × 90 × 55, flanged) for the radar. Sizes in mm.</text>
