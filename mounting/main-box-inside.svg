<text x="757.4" y="551.4" font-size="11" text-anchor="middle" fill="#33434c">3 mm drain hole</text>
<text x="60.0" y="651.4" font-size="14" text-anchor="start" fill="#16232b">• Mount the box with the pipes and glands on the bottom/sides, never the top.</text>
<text x="60.0" y="673.4" font-size="14" text-anchor="start" fill="#16232b">• Valve low, electronics high: a drip from a fitting runs out the drain hole.</text>
<text x="60.0" y="695.4" font-size="14" text-anchor="start" fill="#16232b">• Cables enter through PG7 glands in the bottom wall, each with a drip loop outside.</text>
<text x="60.0" y="717.4" font-size="14" text-anchor="start" fill="#16232b">• Board sits on 4 × M3 standoffs (8 mm) screwed into the box base.</text>
<text x="60.0" y="739.4" font-size="14" text-anchor="start" fill="#16232b">• Valve held with 2 P-clips or cable-tie mounts. Check its length + fittings fits (≈ 150 mm max).</text>
