<text x="859.6" y="124.2" font-size="12" text-anchor="start" fill="#16232b" font-weight="bold">hose up beside the box,</text>
<text x="859.6" y="140.2" font-size="12" text-anchor="start" fill="#16232b" font-weight="bold">then 90° out from the wall</text>
<rect x="765.4" y="274.7" width="12" height="102.0" fill="#cfd6dc" stroke="#d22f2f" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="689.0" y="279.7" width="93.39999999999998" height="92.0" rx="6" fill="#1d2328"/>
