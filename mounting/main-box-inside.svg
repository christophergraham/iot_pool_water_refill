<path d="M292.0,527.4 L292.0,392.0" stroke="#d22f2f" stroke-width="3" stroke-dasharray="6 4"/>
<path d="M387.2,527.4 L387.2,392.0" stroke="#2563c9" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="217.2" cy="523.4" r="5" fill="#fff" stroke="#1d2328" stroke-width="2"/>
<text x="217.2" y="555.4" font-size="11" text-anchor="middle" fill="#33434c">3 mm drain</text>
<text x="60.0" y="681.4" font-size="14" text-anchor="start" fill="#16232b">• Nothing goes through the top of the box: inlet and glands in the bottom, outlet out the side.</text>
<text x="60.0" y="703.4" font-size="14" text-anchor="start" fill="#16232b">• A drip from a fitting runs down to the drain hole, away from the board.</text>
<text x="60.0" y="725.4" font-size="14" text-anchor="start" fill="#16232b">• Cables enter through PG7 glands in the bottom wall, each with a drip loop outside.</text>
<text x="60.0" y="747.4" font-size="14" text-anchor="start" fill="#16232b">• Board sits on 4 × M3 standoffs (8 mm) screwed into the box base.</text>
<text x="60.0" y="769.4" font-size="14" text-anchor="start" fill="#16232b">• Valve stands upright, held with 2 P-clips. Valve + inlet fitting + elbow must fit in ≈ 105 mm;</text>
<text x="60.0" y="791.4" font-size="14" text-anchor="start" fill="#16232b">  if not, clamp the valve to the outside of the box's right side instead.</text>
</svg>